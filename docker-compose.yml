services:
  broker:
    build: .
    container_name: mcp-broker
    restart: unless-stopped
    env_file: .env
    ports:
      # Localhost only: cloudflared (the sole intended client) connects via
      # 127.0.0.1, and the broker/admin API must not listen on the public IP
      # or the tailnet. Admin access from the Mac: ssh -L 8002:localhost:8002.
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/app/data
      - ./settings.yaml:/app/settings.yaml:ro
    # --- Sidecar connectors ---
    # Uncomment to let the broker reach local sidecar MCP servers
    # (workspace-mcp, bigquery-toolbox, etc.). Requires the external
    # network to exist first: `docker network create sidecar-internal`
    # networks:
    #   - sidecar-internal

# Uncomment together with the networks block above.
# networks:
#   sidecar-internal:
#     external: true
